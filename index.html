<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AELIA // M2M Super Engineering Mesh</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(13, 14, 20, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-primary: #f0f3f8;
            --text-secondary: #6c7288;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #core-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-rows: 60px 1fr 240px;
            grid-template-columns: 320px 1fr 360px;
            height: 100vh;
            padding: 16px;
            gap: 16px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-size: 1.1rem;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
